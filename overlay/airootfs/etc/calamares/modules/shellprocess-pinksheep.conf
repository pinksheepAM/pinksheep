# Transforme la base Arch en PinkSheep (même script que l'installeur texte)
---
dontChroot: true
timeout: 7200
verbose: true
i18n:
    name: "Turning Arch into PinkSheep"
    name[fr]: "Transformation en PinkSheep (bureau, pilotes, applis…)"
script:
    - "rm -rf ${ROOT}/usr/share/pinksheep"
    - "cp -a /usr/share/pinksheep ${ROOT}/usr/share/pinksheep"
    - command: "arch-chroot ${ROOT} env PINKSHEEP_STYLE=${gs[packagechooser_style]} bash /usr/share/pinksheep/setup.sh"
      timeout: 7200
