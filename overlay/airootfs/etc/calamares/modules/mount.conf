# PinkSheep — montage pendant l'installation (Calamares)
# Sous-volumes btrfs à la façon d'Ubuntu (@ et @home) : c'est la disposition
# qu'attend Timeshift en mode btrfs. Les journaux et le cache des paquets ont
# leur propre sous-volume pour ne pas alourdir les instantanés (et ne pas
# revenir en arrière dans les journaux quand on restaure le système).
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /var/log
      subvolume: /@log

# Fichier d'échange (swap) dans son propre sous-volume, hors des instantanés
btrfsSwapSubvol: /@swap

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1 ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
