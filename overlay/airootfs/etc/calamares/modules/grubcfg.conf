# PinkSheep — /etc/default/grub, réglé par Calamares avant l'installation de GRUB
# Ajoute seulement ce qu'il faut pour un disque chiffré (rd.luks.uuid,
# fichier-clé, GRUB_ENABLE_CRYPTODISK) ; le reste (nom, thème, attente, écran
# de chargement) est réglé ensuite par setup.sh.
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "loglevel=3", "quiet" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: true
always_use_defaults: false
