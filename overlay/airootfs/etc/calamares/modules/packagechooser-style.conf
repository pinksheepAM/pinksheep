# Page « Style » : PinkSheep ou Hyprlust. Le choix est lu à la fin par
# shellprocess-pinksheep.conf via ${gs[packagechooser_style]}.
---
mode: required
method: legacy
labels:
    step: "Style"
    step[fr]: "Style"
default: pinksheep
items:
    - id: pinksheep
      name: "PinkSheep"
      name[fr]: "PinkSheep (recommandé)"
      description: "PinkSheep's own bar, launcher and notifications. Colours follow your wallpaper (SUPER + W)."
      description[fr]: "La barre, le lanceur et les notifications de PinkSheep. Les couleurs suivent ton fond d'écran (SUPER + W). Tu pourras passer à Hyprlust plus tard avec la commande pinksheep-hyprlust."
      screenshot: "style-pinksheep.png"
    - id: hyprlust
      name: "Hyprlust"
      name[fr]: "Hyprlust"
      description: "Configs from github.com/NischalDawadi/Hyprlust, downloaded during the install and adapted to PinkSheep."
      description[fr]: "Les configs de github.com/NischalDawadi/Hyprlust (barre aux 20+ styles, lanceur, terminal, fastfetch…), téléchargées pendant l'installation et adaptées à PinkSheep. Leurs couleurs suivent aussi le fond d'écran. Réversible avec pinksheep-hyprlust --annuler."
      screenshot: "style-hyprlust.png"
