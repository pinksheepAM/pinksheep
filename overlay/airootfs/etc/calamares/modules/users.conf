---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true
    - name: audio
      must_exist: false
      system: true
    - name: video
      must_exist: false
      system: true
    - name: input
      must_exist: false
      system: true
    - name: storage
      must_exist: false
      system: true

# Les membres de « wheel » peuvent utiliser sudo
sudoersGroup: wheel
sudoersConfigureWithGroup: true

# Mot de passe administrateur (root) séparé de celui de l'utilisateur
setRootPassword: true
doReusePassword: false
doAutologin: false

# Au moins 8 caractères, et pas de case « accepter un mot de passe faible »
passwordRequirements:
    minLength: 8
allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names: [ root ]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "pinksheep"
  forbidden_names: [ localhost ]
