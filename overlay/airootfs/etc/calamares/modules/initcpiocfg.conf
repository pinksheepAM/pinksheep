# PinkSheep — image de démarrage (mkinitcpio), réglée par Calamares
# Calamares réécrit la ligne HOOKS selon le disque : sd-encrypt si le système
# est chiffré, le module crc32c pour btrfs, etc.
# Ensuite setup.sh retire « kms » pour NVIDIA et pinksheep-chargement ajoute
# « plymouth » juste après « systemd », donc AVANT sd-encrypt : la demande de
# mot de passe éventuelle passe par l'écran de chargement.
---
useSystemdHook: true
