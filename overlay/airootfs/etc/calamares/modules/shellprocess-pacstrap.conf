# Installe la base Arch sur le disque choisi (depuis le système live)
---
dontChroot: true
timeout: 3600
verbose: true
i18n:
    name: "Installing the Arch Linux base"
    name[fr]: "Installation de la base Arch Linux"
script:
    - command: "pacstrap -K ${ROOT} base base-devel linux linux-firmware linux-headers intel-ucode amd-ucode grub efibootmgr os-prober networkmanager sudo nano man-db git python zsh"
      timeout: 3600
