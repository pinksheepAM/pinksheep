---
# La partition EFI existante de Windows est souvent petite (100 Mo) :
# on la monte sur /boot/efi, le noyau reste sur la partition PinkSheep.
efi:
    mountPoint:      "/boot/efi"
    recommendedSize: 512MiB
    minimumSize:     32MiB
    label:           "EFI"

userSwapChoices:
    - none
    - file
initialSwapChoice: file

defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs" ]

# Chiffrement du disque : case « Chiffrer le système » proposée, NON cochée.
# Utile surtout sur un PC portable (vol). Le mot de passe est demandé par GRUB
# au démarrage (une seule fois : un fichier-clé déverrouille ensuite le système).
# LUKS1 : GRUB ne sait pas ouvrir LUKS2 avec Argon2.
enableLuksAutomatedPartitioning: true
preCheckEncryption: false
luksGeneration: luks1
lvm:
    enable: false

initialPartitioningChoice: none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
essentialMounts: [ "live-*", "control", "ventoy" ]
