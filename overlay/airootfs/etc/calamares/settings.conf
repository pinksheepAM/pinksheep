# PinkSheep — déroulé de l'installeur graphique (Calamares)
---
modules-search: [ local ]

instances:
# DEBUT-STYLE
- id:       style
  module:   packagechooser
  config:   packagechooser-style.conf
# FIN-STYLE
- id:       pacstrap
  module:   shellprocess
  config:   shellprocess-pacstrap.conf
- id:       pinksheep
  module:   shellprocess
  config:   shellprocess-pinksheep.conf

sequence:
# Pages affichées avant l'installation
- show:
  - welcome
  - locale
  - keyboard
  - packagechooser@style
  - partition
  - users
  - summary
# Ce qui se passe pendant l'installation
- exec:
  - partition
  - mount
  - shellprocess@pacstrap
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader
  - shellprocess@pinksheep
  - umount
- show:
  - finished

branding: pinksheep
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
