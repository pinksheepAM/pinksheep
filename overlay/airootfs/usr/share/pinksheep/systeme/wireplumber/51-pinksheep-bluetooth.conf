# PinkSheep — Bluetooth : le PC envoie le son (A2DP source), il n'en reçoit plus par A2DP.
# Sans ça, certaines enceintes (ex. Sony SRS-XB100) s'activent en « A2DP duplex »
# (son dans les deux sens), qu'elles ne gèrent pas : connectées, mais muettes.
# Rôles par défaut de WirePlumber, moins a2dp_sink (les micros des casques restent
# disponibles par HFP et LE Audio).
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source bap_sink bap_source hfp_hf hfp_ag ]
}
