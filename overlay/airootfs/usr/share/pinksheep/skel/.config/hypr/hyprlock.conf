# Écran de verrouillage PinkSheep
# Couleurs et image : générées depuis le fond d'écran (hyprlock-couleurs.conf)
source = ~/.config/hypr/hyprlock-couleurs.conf
$police = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $fond
    blur_passes = 3
    blur_size = 6
    brightness = 0.7
}

input-field {
    monitor =
    size = 22%, 5%
    outline_thickness = 3
    inner_color = $surface
    outer_color = $primaire $tertiaire 45deg
    check_color = $tertiaire $primaire 120deg
    fail_color = $erreur $erreur 40deg
    capslock_color = $erreur $tertiaire 45deg   # contour différent quand Verr. Maj est activé
    font_color = $texte
    fade_on_empty = false
    rounding = 18
    font_family = $police
    placeholder_text = <i>Mot de passe…</i>
    fail_text = <b>Raté</b> ($ATTEMPTS)
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}

# Heure
label {
    monitor =
    text = $TIME
    color = $accent
    font_size = 110
    font_family = $police
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] LC_TIME=fr_FR.UTF-8 date +"%A %d %B"
    color = $texte
    font_size = 24
    font_family = $police
    position = 0, 110
    halign = center
    valign = center
}

# Bonjour
label {
    monitor =
    text = Salut $USER 🐑
    color = $discret
    font_size = 16
    font_family = $police
    position = 0, -130
    halign = center
    valign = center
}

# Verr. Maj activé : petit message sous le mot de passe
label {
    monitor =
    text = cmd[update:400] grep -qs 1 /sys/class/leds/*::capslock/brightness && echo "⇪ Majuscules activées"
    color = $erreur
    font_size = 13
    font_family = $police
    position = 0, -95
    halign = center
    valign = center
}

