# ╭──────────────────────────────────────────────────────────────╮
# │  PinkSheep — couleurs automatiques à partir du fond d'écran   │
# │  Lancé par « pinksheep-fond » à chaque changement de fond.    │
# │  Chaque [templates.x] prend un modèle dans modeles/ et écrit  │
# │  le fichier de couleurs de l'appli correspondante.            │
# │  Doc : https://github.com/InioX/matugen                       │
# ╰──────────────────────────────────────────────────────────────╯
[config]
version_check = false
fallback_color = "#ff7eb6"   # rose PinkSheep si l'image n'a aucune couleur nette

# Couleurs du terminal : de vrais rouge, vert, etc., légèrement teintés
# par la couleur du fond d'écran pour rester harmonieux.
[config.custom_colors]
rouge   = "#e05561"
vert    = "#5fbf6f"
jaune   = "#e5c07b"
bleu    = "#5c9cf5"
magenta = "#d470d0"
cyan    = "#4fc1c8"

[templates.hyprland]
input_path  = "./modeles/hyprland.lua"
output_path = "../hypr/couleurs.lua"

[templates.hyprlock]
input_path  = "./modeles/hyprlock.conf"
output_path = "../hypr/hyprlock-couleurs.conf"

[templates.waybar]
input_path  = "./modeles/couleurs.css"
output_path = "../waybar/couleurs.css"

[templates.swaync]
input_path  = "./modeles/couleurs.css"
output_path = "../swaync/couleurs.css"

[templates.swayosd]
input_path  = "./modeles/couleurs.css"
output_path = "../swayosd/couleurs.css"

[templates.wlogout]
input_path  = "./modeles/couleurs.css"
output_path = "../wlogout/couleurs.css"

[templates.rofi]
input_path  = "./modeles/rofi.rasi"
output_path = "../rofi/couleurs.rasi"

[templates.kitty]
input_path  = "./modeles/kitty.conf"
output_path = "../kitty/couleurs.conf"

[templates.gtk3]
input_path  = "./modeles/gtk.css"
output_path = "../gtk-3.0/gtk.css"

[templates.gtk4]
input_path  = "./modeles/gtk.css"
output_path = "../gtk-4.0/gtk.css"

# Firefox (thème « Système ») : lié dans chaque profil par pinksheep-firefox
[templates.firefox]
input_path  = "./modeles/firefox.css"
output_path = "../pinksheep/firefox/userChrome.css"

# Thème Kvantum « PinkSheep » (style de toutes les applis Qt 5 et Qt 6)
[templates.kvantum]
input_path  = "./modeles/kvantum.kvconfig"
output_path = "../Kvantum/PinkSheep/PinkSheep.kvconfig"

[templates.kvantum-svg]
input_path  = "./modeles/kvantum.svg"
output_path = "../Kvantum/PinkSheep/PinkSheep.svg"

[templates.parametres]
input_path  = "./modeles/parametres-couleurs.json"
output_path = "../pinksheep/parametres-couleurs.json"

[templates.qt6ct]
input_path  = "./modeles/qt6ct.conf"
output_path = "../qt6ct/colors/pinksheep.conf"

[templates.btop]
input_path  = "./modeles/btop.theme"
output_path = "../btop/themes/pinksheep.theme"

[templates.cava]
input_path  = "./modeles/cava"
output_path = "../cava/config"

[templates.nvim]
input_path  = "./modeles/nvim.lua"
output_path = "../nvim/lua/couleurs.lua"

[templates.yazi]
input_path  = "./modeles/yazi.toml"
output_path = "../yazi/theme.toml"

[templates.foot]
input_path  = "./modeles/foot.ini"
output_path = "../foot/couleurs.ini"

[templates.ia]
input_path  = "./modeles/ia-couleurs.json"
output_path = "../pinksheep/ia-couleurs.json"
