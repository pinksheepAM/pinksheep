# Généré automatiquement par matugen à partir du fond d'écran
[colors]
alpha=0.92
foreground={{colors.on_surface.default.hex_stripped}}
background={{colors.surface.default.hex_stripped}}
selection-foreground={{colors.on_primary.default.hex_stripped}}
selection-background={{colors.primary.default.hex_stripped}}
regular0={{colors.surface_container_high.default.hex_stripped}}
regular1={{ colors.rouge_source.default.hex | harmonize: {{colors.source_color.default.hex}} | replace: "#", "" }}
regular2={{ colors.vert_source.default.hex | harmonize: {{colors.source_color.default.hex}} | replace: "#", "" }}
regular3={{ colors.jaune_source.default.hex | harmonize: {{colors.source_color.default.hex}} | replace: "#", "" }}
regular4={{ colors.bleu_source.default.hex | harmonize: {{colors.source_color.default.hex}} | replace: "#", "" }}
regular5={{colors.primary.default.hex_stripped}}
regular6={{ colors.cyan_source.default.hex | harmonize: {{colors.source_color.default.hex}} | replace: "#", "" }}
regular7={{colors.on_surface_variant.default.hex_stripped}}
bright0={{colors.outline.default.hex_stripped}}
bright1={{colors.rouge.default.hex_stripped}}
bright2={{colors.vert.default.hex_stripped}}
bright3={{colors.jaune.default.hex_stripped}}
bright4={{colors.bleu.default.hex_stripped}}
bright5={{colors.primary_fixed.default.hex_stripped}}
bright6={{colors.cyan.default.hex_stripped}}
bright7={{colors.on_surface.default.hex_stripped}}
